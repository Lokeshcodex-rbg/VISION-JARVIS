<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E733D"/>
      <stop offset="50%" stop-color="#C6A76A"/>
      <stop offset="100%" stop-color="#8E733D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A76A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C6A76A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C6A76A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="896" height="156" rx="8" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Top Decorative Accent Line -->
  <line x1="40" y1="2" x2="860" y2="2" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Primary Wordmark -->
  <text x="450" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif" font-size="28" font-weight="600" letter-spacing="6" fill="#F5F3EE">
    LOKESH UPADHYAY
  </text>

  <!-- Champagne Gold Accent Subtitle -->
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3.5" fill="url(#goldGrad)">
    FRONTEND DEVELOPER  •  AI &amp; MACHINE LEARNING  •  SOFTWARE ENGINEER
  </text>

  <!-- Minimalist Bottom Metric / Tagline -->
  <text x="450" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" font-weight="400" letter-spacing="1.5" fill="#A1A1AA">
    Building Intelligent Systems &amp; Considered Digital Experiences
  </text>
</svg>
